services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hypertube}
      POSTGRES_USER: ${POSTGRES_USER:-hypertube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit: # development mail catcher, web UI on http://localhost:8025
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "8025:8025"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hypertube}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hypertube}
      DATA_DIR: /data
    volumes:
      - appdata:/data
    ports:
      - "6881:6881" # BitTorrent (TCP)
      - "6881:6881/udp" # BitTorrent (uTP / DHT)
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend

  # Optional: publish the site at a domain through a Cloudflare Tunnel.
  # Started only with:  docker compose --profile tunnel up -d
  # CLOUDFLARE_TUNNEL_TOKEN comes from `cloudflared tunnel token <name>` (see README).
  tunnel:
    image: cloudflare/cloudflared:2026.11.0
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend
    profiles: ["tunnel"]

volumes:
  pgdata:
  appdata:
