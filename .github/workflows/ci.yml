name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hypertube
          POSTGRES_USER: hypertube
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hypertube -d hypertube"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-signing-key-not-for-deployment
      DATABASE_URL: postgresql+psycopg://hypertube:ci-only-password@localhost:5432/hypertube
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app alembic tests
      - run: python -m unittest discover -s tests -v
      - name: Verify migrations and model consistency
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  compose:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-signing-key-not-for-deployment
      POSTGRES_PASSWORD: ci-only-password
      PUBLIC_URL: https://video.example.com
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose-dev.yml config --quiet
