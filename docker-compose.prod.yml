# Production stack for a public server (see DEPLOY.md).
#   docker compose -f docker-compose.prod.yml up -d --build
# Differences with docker-compose.yml (local development):
#   * Caddy in front: automatic HTTPS certificates for $DOMAIN, only ports 80/443 exposed
#   * no Mailpit: configure a real SMTP server in .env
#   * the frontend (nginx) is not exposed directly
name: hypertube-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hypertube}
      POSTGRES_USER: ${POSTGRES_USER:-hypertube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hypertube}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hypertube}
      DATA_DIR: /data
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - appdata:/data
    ports:
      - "6881:6881" # BitTorrent (TCP)
      - "6881:6881/udp" # BitTorrent (uTP / DHT)
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
